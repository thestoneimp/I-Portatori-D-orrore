<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Portatori d'Orrore</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f0a0a" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portatori d'Orrore" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 🔹 Sipario: coperto di default finché lo script non ha calcolato e
         applicato l'adattamento allo schermo, così non si vede mai il
         contenuto "a grandezza naturale" per un istante prima che si
         restringa. Viene spostato subito sotto <html> da script.js, per
         sopravvivere ai cambi di schermata che sostituiscono <body>. -->
    <div id="siparioTransizione" class="sipario-transizione attivo"></div>

    <!-- 🔹 L'app è pensata SOLO per l'uso in orizzontale: in verticale
         blocca tutto con questo messaggio, invece di mostrare una
         schermata mal adattata. Anche questo viene spostato sotto <html>
         da script.js, per restare visibile su OGNI schermata. -->
    <div id="avvisoRuotaSchermo" class="avviso-ruota-schermo">
      <div class="avviso-ruota-icona">📱↻</div>
      <p>Ruota il dispositivo</p>
      <p class="avviso-ruota-sottotitolo">L'app funziona solo in orizzontale</p>
    </div>

    <!-- 🔹 Icone di navigazione fisse (Indietro / Home / Avanti): sovrapposte
         a tutte le schermate secondarie, fuori dal flusso normale del
         documento così le schermate hanno più spazio verticale a
         disposizione. Spostate sotto <html> da script.js, per sopravvivere
         ai cambi di schermata. Nascoste di default: ogni schermata sceglie
         cosa mostrare tramite mostraNavigazione()/nascondiNavigazione(). -->
    <div id="navOverlay" class="nav-overlay nascosto">
      <button id="navBtnIndietro" class="nav-icon-btn" type="button" aria-label="Indietro" title="Indietro" hidden>‹</button>
      <button id="navBtnHome" class="nav-icon-btn" type="button" aria-label="Menu principale" title="Menu principale" hidden>⌂</button>
      <button id="navBtnAvanti" class="nav-icon-btn" type="button" aria-label="Avanti" title="Avanti" hidden>›</button>
    </div>

    <!-- 🔹 Le 4 icone di menu della schermata di gioco (Obiettivi/Personaggi/
         Tutorial/Impostazioni): stesso principio di navOverlay sopra, fuori
         dal flusso e immuni allo scale-to-fit/zoom/pan di .game-screen, così
         restano ferme nei 4 angoli veri dello schermo e non occupano spazio
         nel tabellone. Spostate sotto <html> da script.js. Mostrate solo
         durante la partita tramite mostraMenuGioco()/nascondiMenuGioco(). -->
    <div id="gameCornerOverlay" class="game-corner-overlay nascosto">
      <button id="gcBtnObiettivi" class="game-corner-btn corner-top-left" type="button" aria-label="Obiettivi" title="Obiettivi">🕯️</button>
      <button id="gcBtnPersonaggi" class="game-corner-btn corner-top-right" type="button" aria-label="Personaggi" title="Personaggi">🎭</button>
      <button id="gcBtnTutorial" class="game-corner-btn corner-bottom-left" type="button" aria-label="Tutorial" title="Tutorial">📖</button>
      <button id="gcBtnImpostazioni" class="game-corner-btn corner-bottom-right" type="button" aria-label="Impostazioni" title="Impostazioni">🗝️</button>
    </div>

    <div class="home-background" aria-hidden="true">
      <video class="home-background-video" autoplay muted loop playsinline preload="auto">
        <source src="assets/media/animazione-casa-sfondo.mp4" type="video/mp4" />
      </video>
      <div class="home-background-overlay"></div>
    </div>

    <div class="container schermata-iniziale">
      <h1>I Portatori d'Orrore</h1>
      <p class="sottotitolo-iniziale">La casa ricorda chi è entrato.</p>
      <div class="azioni-iniziali">
        <button onclick="startNewGame()">Nuova Partita<span>Inizia una nuova indagine</span></button>
        <button onclick="continueGame()">Continua Partita<span>Riprendi la partita salvata</span></button>
        <button onclick="mostraMenuCampagna()">Modalità Campagna<span>Gioca una storia a lungo termine</span></button>
      </div>
      <p id="status"></p>
    </div>

    <script src="script.js"></script>
    <div id="tabelloneNascosto" style="display: none"></div>

    <div
      id="schermataScenario"
      class="schermata-scenario"
      style="display: none"
    >
      <h1 id="titoloScenario"></h1>

      <div class="contenuto-scenario">
        <div id="testoScenario" class="testo-scenario"></div>
        <div class="immagine-scenario">
          <img id="immagineScenario" src="" alt="Scenario" />
        </div>
      </div>

      <div id="zoomWrapper">
        <div id="tabelloneDinamico" class="griglia-tabellone"></div>
      </div>

      <button id="btnIniziaScenario">Inizia</button>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("service-worker.js").catch(() => {});
        });
      }

      // 🔹 Tentativo di blocco effettivo dell'orientamento (funziona solo su
      // Android/Chrome, e solo se l'app è installata come PWA a schermo
      // intero): dove non è supportato, resta comunque l'avviso CSS
      // "Ruota il dispositivo" a impedire l'uso in verticale.
      function tentaBloccoLandscape() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(() => {});
        }
      }
      tentaBloccoLandscape();
      document.addEventListener("click", tentaBloccoLandscape, { once: true });
    </script>
  </body>
</html>
